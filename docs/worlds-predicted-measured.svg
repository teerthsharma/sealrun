<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="640" height="400" fill="#ffffff"/>
<text x="40" y="34" font-size="20" font-weight="600" fill="#1f2933">How many different worlds can one set of tickets make?</text>
<text x="40" y="52" font-size="13" fill="#6b7785">Grey = the law written down before the runs. Orange = counted on the real server.</text>
<text x="40" y="100" font-size="15" fill="#1f2933">2x2 square</text><text x="200" y="100" font-size="13" fill="#6b7785">4 of 24 orders tried, all different. Not a test of the prediction.</text><text x="40" y="158" font-size="15" fill="#1f2933">line of 3</text><rect x="200" y="136" width="56" height="18" fill="#6b7785"/><text x="262" y="150" font-size="13" fill="#1f2933">4 predicted</text><rect x="200" y="158" width="84" height="18" fill="#c2410c"/><text x="290" y="172" font-size="13" fill="#1f2933">6 measured</text><text x="40" y="216" font-size="15" fill="#1f2933">square, wide window</text><rect x="200" y="194" width="70" height="18" fill="#6b7785"/><text x="276" y="208" font-size="13" fill="#1f2933">5 predicted</text><rect x="200" y="216" width="42" height="18" fill="#c2410c"/><text x="248" y="230" font-size="13" fill="#1f2933">3 measured</text><text x="40" y="274" font-size="15" fill="#1f2933">triangle</text><rect x="200" y="252" width="84" height="18" fill="#6b7785"/><text x="290" y="266" font-size="13" fill="#1f2933">6 predicted</text><rect x="200" y="274" width="84" height="18" fill="#c2410c"/><text x="290" y="288" font-size="13" fill="#1f2933">6 measured</text><text x="40" y="332" font-size="15" fill="#1f2933">line of 4</text><rect x="200" y="310" width="112" height="18" fill="#6b7785"/><text x="318" y="324" font-size="13" fill="#1f2933">8 predicted</text><rect x="200" y="332" width="336" height="18" fill="#c2410c"/><text x="542" y="346" font-size="13" fill="#1f2933">24 measured</text>
<text x="40" y="384" font-size="12" fill="#6b7785">The same order built twice also differs, by 122 to 3,396 blocks, so these counts are still being sharpened.</text>
</svg>
