<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sealrun round 2</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f1;
  --surface: #fffffc;
  --ink: #1d2127;
  --muted: #5b6370;
  --rule: #d9d6cc;
  --pending: #656d78;
  --active: #1f5fd1;
  --failing: #b3261e;
  --reached: #17703f;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b;
    --surface: #1c1f25;
    --ink: #e9e7e1;
    --muted: #a3a9b2;
    --rule: #33373f;
    --pending: #a3aab4;
    --active: #8db4ff;
    --failing: #ff8f84;
    --reached: #7fd6a2;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 1rem/1.6 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; }
h1 { font-size: clamp(2.2rem, 8vw, 3.5rem); margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 1.8rem; margin: 0 0 0.5rem; }
h3 { font-size: 1.25rem; margin: 0.35rem 0 0.4rem; }
p { margin: 0; }
.wrap { max-width: 52rem; margin: 0 auto; padding: 0 16px; }

[data-status="pending"] { --c: var(--pending); }
[data-status="active"] { --c: var(--active); }
[data-status="blocked"] { --c: var(--failing); }
[data-status="reached"] { --c: var(--reached); }
[data-status="retired"] { --c: var(--muted); }

.hero { padding: 3.5rem 0 2rem; border-bottom: 1px solid var(--rule); }
.intro { color: var(--muted); margin-top: 0.75rem; max-width: 46ch; }
.note { margin-top: 0.75rem; color: var(--muted); font-size: 0.92rem; }
.section { margin-top: 3rem; }
.bars {
  display: flex; align-items: flex-end; gap: 0.75rem; overflow-x: auto;
  padding: 1rem 0 0; min-height: 11rem; border-bottom: 1px solid var(--rule);
}
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 3.25rem; }
.num { font-size: 0.85rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.stem { display: block; width: 2.2rem; background: var(--muted); border-radius: 2px 2px 0 0; }
.lbl { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }
.none { color: var(--muted); padding: 1rem 0; }
.grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 4px;
  padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.4rem;
}
.gid { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.7rem; font-size: 0.86rem; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 0.35rem; color: var(--c, var(--muted));
  border: 1px solid currentColor; border-radius: 999px; padding: 0.05rem 0.6rem; font-size: 0.8rem;
}
.pill::before { content: ""; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; }
.plain { color: var(--ink); font-size: 0.95rem; }
.dept { font-size: 0.85rem; color: var(--muted); }

@media (max-width: 560px) {
  .hero { padding-top: 2rem; }
  .card { padding: 0.9rem; }
}
</style>
</head>
<body>
<main class="wrap" id="app"><p>Loading round 2.</p></main>
<script>
function renderR2(data) {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const badge = (s = 'pending') => ({ pending: 'not started', active: 'in progress', blocked: 'failing', reached: 'passing', retired: 'retired' })[s] ?? s;
  const card = (g) => `<article class="card" data-goal="${esc(g.id)}">
    <p class="gid"><span>${esc(g.id)}</span><span class="pill" data-status="${esc(g.status)}">${esc(badge(g.status))}</span></p>
    <h3>${esc(g.title)}</h3>
    <p class="plain">${esc(g.plain)}</p>
    ${g.department ? `<p class="dept">${esc(g.department)}</p>` : ''}
  </article>`;

  const max = Math.max(1, ...(data.orders || []).map((o) => o.diff));
  const bars = Array.isArray(data.orders)
    ? `<div class="bars">${data.orders.map((o, i) => `<div class="col" data-order="${i}">
        <span class="num">${esc(o.diff)}</span>
        <span class="stem" style="height:${Math.round((o.diff / max) * 160)}px"></span>
        <span class="lbl">order ${i + 1}</span>
      </div>`).join('')}</div>`
    : '<p class="none">not run yet</p>';

  const note = data.route && data.route.played === false && data.route.note
    ? `<p class="note">${esc(data.route.note)}</p>` : '';

  return `<header class="hero">
    <h1>sealrun round 2</h1>
    <p class="intro">Each card is one goal of round 2. Each bar is one build order, its height the number of blocks that differ from the reference.</p>
    ${note}
  </header>
  <section class="section" id="orders">
    <h2>Build orders</h2>
    ${bars}
  </section>
  <section class="section" id="goals">
    <h2>Goals</h2>
    <div class="grid">${data.goals.map(card).join('')}</div>
  </section>`;
}
</script>
<script>
fetch("r2.json")
  .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
  .then((data) => { document.getElementById("app").innerHTML = renderR2(data); })
  .catch(() => {
    document.getElementById("app").textContent = 'Could not load r2.json. Serve the site folder over http, for example python -m http.server.';
  });
</script>
</body>
</html>
