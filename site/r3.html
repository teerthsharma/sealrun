<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sealrun round 3</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f1;
  --surface: #fffffc;
  --ink: #1d2127;
  --muted: #5b6370;
  --rule: #d9d6cc;
  --pending: #656d78;
  --active: #1f5fd1;
  --blocked: #b3261e;
  --reached: #17703f;
  --retired: #5b6370;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b;
    --surface: #1c1f25;
    --ink: #e9e7e1;
    --muted: #a3a9b2;
    --rule: #33373f;
    --pending: #a3aab4;
    --active: #8db4ff;
    --blocked: #ff8f84;
    --reached: #7fd6a2;
    --retired: #a3a9b2;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b;
  --surface: #1c1f25;
  --ink: #e9e7e1;
  --muted: #a3a9b2;
  --rule: #33373f;
  --pending: #a3aab4;
  --active: #8db4ff;
  --blocked: #ff8f84;
  --reached: #7fd6a2;
  --retired: #a3a9b2;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 1rem/1.6 var(--sans); }
h1, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; }
h1 { font-size: clamp(2.2rem, 8vw, 3.5rem); margin: 0; letter-spacing: -0.02em; }
h3 { font-size: 1.25rem; margin: 0.35rem 0 0.4rem; }
p { margin: 0; }
.wrap { max-width: 52rem; margin: 0 auto; padding: 0 16px; }
.hero { padding: 3.5rem 0 2rem; border-bottom: 1px solid var(--rule); }
.intro { color: var(--muted); margin-top: 0.75rem; max-width: 46ch; }
.grid {
  display: grid; gap: 0.9rem; margin: 2rem 0 3rem;
  grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
}
.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 4px;
  padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.4rem;
  --c: var(--pending);
}
.card.active { --c: var(--active); }
.card.blocked { --c: var(--blocked); }
.card.reached { --c: var(--reached); }
.card.retired { --c: var(--retired); }
.gid { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.7rem; font-size: 0.86rem; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 0.35rem; color: var(--c);
  border: 1px solid currentColor; border-radius: 999px; padding: 0.05rem 0.6rem; font-size: 0.8rem;
}
.pill::before { content: ""; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; }
.plain { font-size: 0.95rem; }
.none { color: var(--muted); padding: 2rem 0; }
@media (max-width: 560px) {
  .hero { padding-top: 2rem; }
  .card { padding: 0.9rem; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>sealrun round 3</h1>
    <p class="intro">One card per goal of round 3, with its plain-text summary and its status.</p>
  </header>
  <section class="grid" id="cards"><p class="none">Loading round 3.</p></section>
</main>
<script>
function renderCards(data) {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  return data.map((e) => {
    const status = e.status || 'pending';
    return `<article class="card ${esc(status)}" data-goal="${esc(e.id)}">
    <p class="gid"><span>${esc(e.id)}</span><span class="pill">${esc(status)}</span></p>
    <h3>${esc(e.card.title)}</h3>
    <p class="plain">${esc(e.card.plain)}</p>
  </article>`;
  }).join('');
}
</script>
<script>
fetch("r3.json")
  .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
  .then((data) => { document.getElementById("cards").innerHTML = renderCards(data); })
  .catch(() => {
    document.getElementById("cards").innerHTML = '<p class="none">Could not load r3.json. Serve the site folder over http, for example python -m http.server.</p>';
  });
</script>
</body>
</html>
